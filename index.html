<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talon Eddyline MVP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background-color: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
            border-left: 4px solid #c33;
        }

        .success {
            background-color: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
            border-left: 4px solid #3c3;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info {
            background-color: #eef;
            color: #33c;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
            border-left: 4px solid #33c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ Talon Eddyline</h1>
        <p class="subtitle">Find your perfect flying destination</p>
        
        <form id="searchForm">
            <div class="form-group">
                <label for="departure">Departure Airport</label>
                <input 
                    type="text" 
                    id="departure" 
                    placeholder="e.g., SFO, KJFK, or airport name"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="form-group">
                <label for="destination">Destination Airport</label>
                <input 
                    type="text" 
                    id="destination" 
                    placeholder="e.g., LAX, KORD, or airport name"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="form-group">
                <label for="distance">Maximum Distance (nm)</label>
                <input 
                    type="text" 
                    id="distance" 
                    placeholder="e.g., 500"
                    value="500"
                    required
                >
            </div>

            <button type="submit">Search Routes</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading airports...</p>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
        <div class="info" id="info"></div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            OUR_AIRPORTS_URL: 'https://ourairports.com/data/airports.csv',
            TIMEOUT_MS: 10000, // 10 second timeout
            FALLBACK_AIRPORTS: [
                { id: 1, code: 'SFO', name: 'San Francisco International Airport', country_code: 'US' },
                { id: 2, code: 'LAX', name: 'Los Angeles International Airport', country_code: 'US' },
                { id: 3, code: 'ORD', name: 'Chicago O\'Hare International Airport', country_code: 'US' },
                { id: 4, code: 'DFW', name: 'Dallas/Fort Worth International Airport', country_code: 'US' },
                { id: 5, code: 'DEN', name: 'Denver International Airport', country_code: 'US' },
                { id: 6, code: 'JFK', name: 'John F. Kennedy International Airport', country_code: 'US' },
                { id: 7, code: 'ATL', name: 'Hartsfield-Jackson Atlanta International Airport', country_code: 'US' },
                { id: 8, code: 'MIA', name: 'Miami International Airport', country_code: 'US' },
                { id: 9, code: 'SEA', name: 'Seattle-Tacoma International Airport', country_code: 'US' },
                { id: 10, code: 'LAS', name: 'Harry Reid International Airport', country_code: 'US' }
            ]
        };

        let airportDatabase = [];

        /**
         * Load airports from OurAirports CSV with comprehensive error handling
         * Includes timeout handling, CSV validation, and row guards
         * Falls back to local database if remote fetch fails
         */
        async function loadAirportsFromOurAirportsOrFallback() {
            try {
                console.log('Starting airport data load from OurAirports...');
                showLoading(true);
                showError('');
                showInfo('');

                // Create abort controller for timeout handling
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), CONFIG.TIMEOUT_MS);

                try {
                    console.log(`Fetching from: ${CONFIG.OUR_AIRPORTS_URL}`);
                    const response = await fetch(CONFIG.OUR_AIRPORTS_URL, {
                        signal: controller.signal,
                        method: 'GET',
                        headers: {
                            'Accept': 'text/csv'
                        }
                    });

                    clearTimeout(timeoutId);

                    // Validate HTTP response
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    // Validate content type
                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('text')) {
                        throw new Error('Invalid content type received');
                    }

                    const csvText = await response.text();

                    // Validate CSV content
                    if (!csvText || csvText.trim().length === 0) {
                        throw new Error('Empty CSV data received');
                    }

                    // Parse CSV and apply validation and row guards
                    const airports = parseAirportsCSV(csvText);

                    if (!airports || airports.length === 0) {
                        throw new Error('No valid airport records parsed from CSV');
                    }

                    airportDatabase = airports;
                    console.log(`Successfully loaded ${airports.length} airports from OurAirports`);
                    showSuccess(`Loaded ${airports.length} airports from OurAirports`);
                    return airports;

                } catch (fetchError) {
                    clearTimeout(timeoutId);

                    // Check if error is due to timeout
                    if (fetchError.name === 'AbortError') {
                        console.warn(`Timeout fetching airports (${CONFIG.TIMEOUT_MS}ms exceeded)`);
                        throw new Error(`Request timeout after ${CONFIG.TIMEOUT_MS}ms`);
                    }

                    // Re-throw other fetch errors
                    throw fetchError;
                }

            } catch (error) {
                console.error('Failed to load from OurAirports:', error.message);
                console.log('Falling back to local airport database...');
                
                // Use fallback database
                airportDatabase = CONFIG.FALLBACK_AIRPORTS;
                showInfo(`Using fallback airport database (${CONFIG.FALLBACK_AIRPORTS.length} airports). Reason: ${error.message}`);
                
                return CONFIG.FALLBACK_AIRPORTS;
            } finally {
                showLoading(false);
            }
        }

        /**
         * Parse CSV data with validation and row guards
         * @param {string} csvText - Raw CSV text
         * @returns {Array} Array of validated airport objects
         */
        function parseAirportsCSV(csvText) {
            const lines = csvText.split('\n');
            const airports = [];

            // Guard: Must have header row
            if (lines.length < 2) {
                console.warn('CSV has no data rows');
                return airports;
            }

            // Parse header
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            
            // Find column indices with validation
            const idIndex = headers.indexOf('id');
            const codeIndex = headers.indexOf('iata');
            const nameIndex = headers.indexOf('name');
            const countryIndex = headers.indexOf('iso_country');

            // Guard: Validate required columns exist
            if (idIndex === -1 || codeIndex === -1 || nameIndex === -1 || countryIndex === -1) {
                console.warn('CSV missing required columns. Headers found:', headers.join(', '));
                return airports;
            }

            // Parse data rows
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();

                // Row guard: Skip empty lines
                if (!line) {
                    continue;
                }

                try {
                    // Simple CSV parsing (handle quoted fields)
                    const fields = parseCSVLine(line);

                    // Row guard: Validate row has enough fields
                    if (fields.length <= Math.max(idIndex, codeIndex, nameIndex, countryIndex)) {
                        console.warn(`Row ${i}: Insufficient fields (${fields.length} found)`);
                        continue;
                    }

                    const id = fields[idIndex]?.trim();
                    const code = fields[codeIndex]?.trim();
                    const name = fields[nameIndex]?.trim();
                    const country = fields[countryIndex]?.trim();

                    // Row guard: Validate required fields are non-empty
                    if (!code || !name || !country) {
                        console.warn(`Row ${i}: Missing required fields (code="${code}", name="${name}", country="${country}")`);
                        continue;
                    }

                    // Row guard: Validate code format (IATA should be 3 letters or empty)
                    if (code && code.length !== 3) {
                        console.warn(`Row ${i}: Invalid IATA code "${code}" (expected 3 characters)`);
                        continue;
                    }

                    // Create airport object
                    const airport = {
                        id: id || '',
                        code: code.toUpperCase(),
                        name: name,
                        country_code: country.toUpperCase()
                    };

                    airports.push(airport);

                } catch (parseError) {
                    console.warn(`Row ${i}: Parsing error:`, parseError.message);
                    continue;
                }
            }

            return airports;
        }

        /**
         * Parse a single CSV line handling quoted fields
         * @param {string} line - CSV line to parse
         * @returns {Array} Array of field values
         */
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let insideQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const nextChar = line[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        current += '"';
                        i++; // Skip next quote
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }

            result.push(current);
            return result;
        }

        /**
         * Find airport by code or name (case-insensitive)
         * @param {string} query - Airport code or name
         * @returns {Object|null} Airport object or null
         */
        function findAirport(query) {
            if (!query) return null;

            const upperQuery = query.toUpperCase();

            // Try exact code match first
            let airport = airportDatabase.find(a => a.code === upperQuery);
            if (airport) return airport;

            // Try case-insensitive name match
            const lowerQuery = query.toLowerCase();
            airport = airportDatabase.find(a => 
                a.name.toLowerCase().includes(lowerQuery) ||
                a.code.toLowerCase() === lowerQuery
            );

            return airport || null;
        }

        /**
         * Calculate distance between two airports (simplified)
         * @param {Object} airport1 - First airport
         * @param {Object} airport2 - Second airport
         * @returns {number} Distance in nautical miles
         */
        function calculateDistance(airport1, airport2) {
            // Placeholder implementation
            return Math.random() * 2000;
        }

        /**
         * UI Helper: Show/hide loading state
         */
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        /**
         * UI Helper: Show error message
         */
        function showError(message) {
            const errorEl = document.getElementById('error');
            if (message) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
            }
        }

        /**
         * UI Helper: Show success message
         */
        function showSuccess(message) {
            const successEl = document.getElementById('success');
            if (message) {
                successEl.textContent = message;
                successEl.style.display = 'block';
            } else {
                successEl.style.display = 'none';
            }
        }

        /**
         * UI Helper: Show info message
         */
        function showInfo(message) {
            const infoEl = document.getElementById('info');
            if (message) {
                infoEl.textContent = message;
                infoEl.style.display = 'block';
            } else {
                infoEl.style.display = 'none';
            }
        }

        /**
         * Handle form submission
         */
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const departure = document.getElementById('departure').value;
            const destination = document.getElementById('destination').value;
            const maxDistance = parseInt(document.getElementById('distance').value);

            if (!departure || !destination) {
                showError('Please enter both departure and destination airports');
                return;
            }

            if (isNaN(maxDistance) || maxDistance <= 0) {
                showError('Please enter a valid maximum distance');
                return;
            }

            // Find airports
            const departureAirport = findAirport(departure);
            const destinationAirport = findAirport(destination);

            if (!departureAirport) {
                showError(`Departure airport "${departure}" not found`);
                return;
            }

            if (!destinationAirport) {
                showError(`Destination airport "${destination}" not found`);
                return;
            }

            const distance = calculateDistance(departureAirport, destinationAirport);

            if (distance > maxDistance) {
                showError(`Distance (${distance.toFixed(0)} nm) exceeds maximum (${maxDistance} nm)`);
                return;
            }

            showSuccess(`Route found: ${departureAirport.code} → ${destinationAirport.code} (${distance.toFixed(0)} nm)`);
        });

        /**
         * Initialize application
         */
        async function initializeApp() {
            console.log('Initializing Talon Eddyline MVP...');
            try {
                await loadAirportsFromOurAirportsOrFallback();
            } catch (error) {
                console.error('Failed to initialize:', error);
                showError('Failed to initialize application. Using fallback data.');
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
